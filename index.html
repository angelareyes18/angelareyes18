 <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Angela's 18th Birthday</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@600&family=Playfair+Display:wght@700&display=swap">
        <link rel="icon" type="image/png" href="./favicon.png">
        <meta name="description" content="You're invited to Janaiah Angela's 18th birthday, Saturday, January 16, 2027 at 5:00 PM, Palace Convention Centre, Laval, Quebec.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://angelareyes18.github.io/angelareyes18/">
        <meta property="og:title" content="Angela's 18th Birthday">
        <meta property="og:description" content="Saturday, January 16, 2027 · 5:00 PM · Palace Convention Centre, Laval. Please RSVP by December 20, 2026.">
        <meta property="og:image" content="https://angelareyes18.github.io/angelareyes18/DESIGN/you_are_invited.jpg">
        <meta property="og:image:width" content="1428">
        <meta property="og:image:height" content="2000">
    </head>

    <body>
        <div class="invitation">
            <!--AUDIO-->
            <audio id="background-music" loop preload="none">
                <source src="./beauty-and-the-beast.m4a" type="audio/mp4">
            </audio>

            <button id="music-button" aria-pressed="false">▶ Play Music</button>

            <!--You are Invited-->
            <div class="design">
                <img src="./DESIGN/you_are_invited.jpg" width="1428" height="2000" alt="Together with their family, Mr. Jeffrey and Mrs. Odessa Reyes cordially invite you to celebrate Janaiah Angela's 18th birthday. Saturday, January 16, 2027 at 5:00 PM. Palace Convention Center, 1717 Boulevard Le Corbusier, Laval, Quebec. An enchanted evening awaits. We would be honored to celebrate this magical milestone with you." fetchpriority="high">
            </div>

            <!--Details (Dress Code, Gifts, etc.)-->
            <div class="design">
                <img src="./DESIGN/event_details.jpg" width="1428" height="2000" alt="Details. Dress code: Formal. We invite our female guests to wear a long dress or an elegant cocktail dress. We respectfully request that you avoid wearing yellow. Gifts: Your presence is the greatest gift of all! Should you wish to bless the birthday celebrant with a gift, a monetary gift would be sincerely appreciated. Thank you for being part of this magical celebration. Love, Angela." loading="lazy">
            </div>

            <!--Venue Details (Address)-->
            <div class="venue">
                <img src="./DESIGN/venue.jpg" width="1428" height="2000" alt="Venue: Palace Convention Centre, 1717 Boulevard Le Corbusier, Laval, QC H7S 2K7." loading="lazy">

                <a href="https://www.google.com/maps/search/?api=1&amp;query=Palace+Convention+Centre+1717+Boulevard+Le+Corbusier+Laval+QC+H7S+2K7"
                    class="map-button" target="_blank" rel="noopener">
                    View on Google Maps
                </a>

                <a class="map-link" aria-label="Open venue in Google Maps" href="https://www.google.com/maps/search/?api=1&amp;query=Palace+Convention+Centre+1717+Boulevard+Le+Corbusier+Laval+QC+H7S+2K7" target="_blank" rel="noopener"></a>
            </div>

            <!--Program Details (Order of Events)-->
            <div class="design">
                <img src="./DESIGN/program.jpg" width="1428" height="2000" alt="Program: 4:30 PM arrival of guests. 5:00 PM cocktail hour. 6:30 PM grand entrance. 7:30 PM dinner. 8:30 PM party." loading="lazy">
            </div>

            <!--RSVP link-->

            <div class="rsvp">
                <img src="./DESIGN/rsvp.jpg" width="1428" height="2000" alt="Be our guest. The best memories are created with special people like you. It would be a pleasure to have you join us. Please RSVP by December 20, 2026 by clicking the RSVP button and filling in the form to confirm your attendance." loading="lazy">
                <a class="rsvp-link" href="https://forms.gle/wLHYWRQAx8Fb5sa77" target="_blank" rel="noopener" aria-label="RSVP on Google Forms"></a>
            </div>

            <!--Countdown-->
            <div class="countdown">
                <img src="./DESIGN/countdown.jpg" width="1428" height="2000" alt="Countdown to the party. I can't wait to celebrate with you. Love, Angela." loading="lazy">

                <div id="days">
                    <span class="number">–</span>
                    <span class="label">DAYS</span>
                </div>

                <div id="hours">
                    <span class="number">–</span>
                    <span class="label">HOURS</span>
                </div>

                <div id="minutes">
                    <span class="number">–</span>
                    <span class="label">MINUTES</span>
                </div>

                <div id="seconds">
                    <span class="number">–</span>
                    <span class="label">SECONDS</span>
                </div>
            </div>
        </div>

        <script src="./script.js" defer></script>
    </body>

</html>
