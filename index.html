<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angela's 18th Birthday</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Tangerine:wght@400;700&display=swap">
</head>

<body>

    <div class="invitation">
        <!--AUDIO-->
        <audio id="background-music" loop>
            <source src="./beauty-and-the-beast.mp3" type="audio/mpeg">
        </audio>
    
        <button id="music-button">▶ Play Music</button>
    
        <!--You are Invited-->
        <div class="design">
            <img src="./DESIGN/1.png" alt="You Are Invited">
        </div>
    
        <!--Details (Dress Code, Gifts, etc.)-->
        <div class="design">
            <img src="./DESIGN/2.png" alt="Details">
        </div>
    
        <!--Venue Details (Address)-->
        <div class="venue">
            <img src="./DESIGN/3.png" alt="Venue Address">
    
            <a href="https://www.google.com/maps/place/Palace+Convention+Centre/@45.5667839,-73.7359558,16z/data=!3m2!4b1!5s0x4cc923cdb0f2ab29:0x58209f6e3513eb45!4m6!3m5!1s0x4cc923cdb12fe6dd:0x7e6fff012eb0280b!8m2!3d45.5667839!4d-73.7333755!16s%2Fg%2F11gmvjswjy?entry=ttu&g_ep=EgoyMDI2MDcyMi4wIKXMDSoASAFQAw%3D%3D" class="map-button" target="_blank">
                View on Google Maps
            </a>
        </div>
    
        <!--Program Details (Order of Events)-->
        <div class="design">
            <img src="./DESIGN/4.png" alt="Program Details">
        </div>
        
        <!--RSVP link-->
    
        <div class="rsvp">
            <img src="./DESIGN/5.png" alt="RSVP button">
    
            <a class="rsvp-link" href="https://forms.gle/FuCwDyVmaayv5iPu9" target="_blank"></a>
        </div>
        
        <!--Countdown-->
        <div class="countdown">
            <img src="./DESIGN/6.png" alt="Countdown">
    
            <div id="days">
                <span class="number"></span>
                <span class="label">DAYS</span>
            </div>
    
            <div id="hours">
                <span class="number"></span>
                <span class="label">HOURS</span>
            </div>
    
            <div id="minutes">
                <span class="number"></span>
                <span class="label">MINUTES</span>
            </div>
    
            <div id="seconds">
                <span class="number"></span>
                <span class="label">SECONDS</span>
            </div>
        </div>
    </div>

    <script src="./script.js" defer></script>
</body>

</html>
